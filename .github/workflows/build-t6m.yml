name: Build ImmortalWrt 25.12 - Qihoo 360 T6M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            xsltproc \
            libelf-dev \
            device-tree-compiler \
            qemu-utils \
            ccache \
            swig \
            time \
            libxml-parser-perl \
            libxml2-utils \
            libtool \
            autoconf \
            automake \
            autopoint \
            pkgconf \
            patch \
            quilt \
            subversion

      - name: Clone ImmortalWrt 25.12
        run: |
          git clone --branch openwrt-25.12 --single-branch \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

      - name: Apply Qihoo 360 T6M support
        working-directory: immortalwrt
        run: |
          git fetch https://github.com/immortalwrt/immortalwrt.git \
            pull/2436/head:t6m-pr

          git diff HEAD..t6m-pr > /tmp/t6m.patch

          git apply --3way /tmp/t6m.patch

      - name: Verify T6M support
        working-directory: immortalwrt
        run: |
          echo "Checking for Qihoo 360 T6M files..."
          find target package -iname '*t6m*' -o -iname '*360*' | head -100

      - name: Update feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build
        working-directory: immortalwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          EOF

          make defconfig

      - name: Show target configuration
        working-directory: immortalwrt
        run: |
          grep -E 'CONFIG_TARGET|360.*T6M|T6M' .config || true

      - name: Download package sources
        working-directory: immortalwrt
        run: |
          make download -j8

      - name: Build firmware
        working-directory: immortalwrt
        run: |
          make -j$(nproc) V=s

      - name: List firmware files
        working-directory: immortalwrt
        run: |
          find bin/targets -type f \( \
            -name '*.bin' -o \
            -name '*.itb' -o \
            -name '*.img' \
          \) -print

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12-t6m
          path: immortalwrt/bin/targets/**
          if-no-files-found: error
