name: Build ImmortalWrt 25.12 - Qihoo 360 T6M

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget \
            python3 python3-pip python3-setuptools \
            swig time xsltproc \
            libelf-dev ecj fastjar \
            java-propose-classpath \
            libpython3-dev python3-ply \
            python3-docutils \
            device-tree-compiler \
            qemu-utils \
            ccache

      - name: Clone ImmortalWrt 25.12
        run: |
          git clone \
            --branch openwrt-25.12 \
            --single-branch \
            https://github.com/immortalwrt/immortalwrt.git

          cd immortalwrt

          echo "ImmortalWrt commit:"
          git log -1 --oneline

      - name: Download T6M support patch
        run: |
          cd immortalwrt

          git fetch \
            https://github.com/immortalwrt/immortalwrt.git \
            pull/2436/head:t6m-pr

          git log --oneline --decorate -10 t6m-pr

      - name: Apply T6M commits
        run: |
          cd immortalwrt

          # Find commits belonging to the T6M PR
          git log --reverse \
            --format='%H' \
            HEAD..t6m-pr > /tmp/t6m-commits

          echo "T6M commits:"
          cat /tmp/t6m-commits

          # Apply the PR as a patch instead of cherry-picking
          git diff HEAD..t6m-pr > /tmp/t6m.patch

          if [ ! -s /tmp/t6m.patch ]; then
            echo "ERROR: T6M patch is empty"
            exit 1
          fi

          git apply --3way /tmp/t6m.patch

          echo "T6M changes applied successfully."

      - name: Verify T6M device definition
        run: |
          cd immortalwrt

          echo "Searching for T6M support..."

          grep -Rni \
            "360t6m\|360-t6m\|t6m" \
            target/linux/ramips \
            target/linux/ramips/image \
            target/linux/ramips/mt7621 \
            2>/dev/null | head -100 || true

          echo "Checking DTS files..."

          find target/linux/ramips -type f \
            \( -iname "*t6m*" -o -iname "*360*" \) \
            -print

      - name: Update feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Select MT7621 target
        working-directory: immortalwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          EOF

          make defconfig

      - name: Verify target configuration
        working-directory: immortalwrt
        run: |
          echo "===== TARGET CONFIG ====="
          grep '^CONFIG_TARGET' .config

          echo "===== T6M references ====="
          grep -Rni "qihoo.*t6m\|360.*t6m" \
            target/linux/ramips \
            2>/dev/null || true

      - name: Download package sources
        working-directory: immortalwrt
        run: |
          make download -j8 V=s

      - name: Build firmware
        working-directory: immortalwrt
        run: |
          make -j$(nproc) V=s

      - name: Show generated firmware
        working-directory: immortalwrt
        run: |
          echo "======================================"
          echo "GENERATED FIRMWARE"
          echo "======================================"

          find bin/targets/ramips/mt7621 \
            -type f \
            \( -name "*.bin" -o -name "*.itb" \) \
            -print

          echo "======================================"
          echo "SHA256"
          echo "======================================"

          cd bin/targets/ramips/mt7621

          sha256sum *.bin 2>/dev/null || true

      - name: Upload T6M firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-25.12-Qihoo-360T6M
          path: |
            immortalwrt/bin/targets/ramips/mt7621/*.bin
            immortalwrt/bin/targets/ramips/mt7621/*.itb
            immortalwrt/bin/targets/ramips/mt7621/sha256sums
          if-no-files-found: error
          retention-days: 30
